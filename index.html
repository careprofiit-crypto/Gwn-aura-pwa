<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GWN Aura</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#d4af37">
</head>
<body style="background:#0a0a0c; color:#d4af37; height:100vh; margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif;">
  <h2>GWN Aura</h2>
  <p id="status">Loading your wallet...</p>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
    if (navigator.onLine) {
      setTimeout(() => {
        window.location.replace("https://gwnaura-app.blogspot.com/");
      }, 1500);
    } else {
      document.getElementById('status').textContent = "You are offline. Reconnect to access GWN Aura.";
    }
  </script>
</body>
</html>
