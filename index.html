<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GWN Aura</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#d4af37">
</head>
<body>
  <div style="background:#0a0a0c; color:#d4af37; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif;">
    <h2>GWN Aura PWA Loading...</h2>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => console.log('SW Error', err));
        });
      }
      setTimeout(() => {
        window.location.href = "https://gwnaura-app.blogspot.com/";
      }, 800);
    </script>
  </div>
</body>
</html>
