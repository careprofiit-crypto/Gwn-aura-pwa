<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GWN Aura</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#d4af37">
</head>
<body style="background:#0a0a0c; color:#d4af37; height:100vh; margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif;">
  <h2>GWN Aura</h2>
  <p id="status">Initializing secure session...</p>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then((registration) => {
        console.log('ServiceWorker registration successful');
        // Give service worker time to activate and pass offline checks
        setTimeout(() => {
          if (navigator.onLine) {
            window.location.replace("https://gwnaura-app.blogspot.com/");
          }
        }, 2500);
      }).catch((err) => {
        console.log('ServiceWorker registration failed: ', err);
        window.location.replace("https://gwnaura-app.blogspot.com/");
      });
    } else {
      window.location.replace("https://gwnaura-app.blogspot.com/");
    }
  </script>
</body>
</html>
